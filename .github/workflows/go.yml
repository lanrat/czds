name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # allow manually calling the action
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

    - name: Build
      run: make

  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      # go-version-file is deliberately omitted: the action defaults to
      # go-version 'stable' and that input wins when both are set (it warns and
      # ignores the file), so passing go.mod here would be a no-op. Scanning
      # against the latest patched Go is what we want anyway.
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
